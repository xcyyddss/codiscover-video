[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "codiscover-video"
version = "0.1.0"
description = "Collaborative video discovery with user-controlled intent and local evidence memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "src/codiscover_video/vendor/LICENSE.*", "integrations/dsh/LICENSE.upstream"]
keywords = ["agent", "video-discovery", "rag", "bilibili", "deepseek"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
bilibili = ["bilibili-api-python>=17,<18", "aiohttp>=3.11,<4", "qrcode[pil]>=8,<9", "pillow>=11,<13", "mcp>=1.20,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
codiscover-video = "codiscover_video.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
extend-exclude = ["src/codiscover_video/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/codiscover_video"]
